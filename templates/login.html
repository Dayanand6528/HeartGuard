{% extends 'base.html' %}

{% block title %}Login - HeartGuard Medical Portal{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto 4rem;">
    <div class="glass-panel" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: var(--primary-cyan); margin-bottom: 0.75rem;"></i>
            <h2 style="font-size: 1.8rem; margin-bottom: 0.25rem;">Portal Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Access your Patient, Doctor, or Admin account</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Role Category</label>
                <select name="role" id="loginRole" class="form-select">
                    <option value="patient">Patient Portal</option>
                    <option value="doctor">Doctor Portal</option>
                    <option value="admin">Administrator Portal</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-cyan" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
            </button>
        </form>

        <!-- Quick Demo Autofill Buttons -->
        <div style="margin-top: 2rem; pt: 1.5rem; border-top: 1px solid var(--border-glass); text-align: center;">
            <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.75rem;">⚡ Quick Demo Login Credentials:</span>
            <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
                <button type="button" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;" onclick="quickLogin('patient@heartguard.com', 'patient123', 'patient')">Patient Demo</button>
                <button type="button" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;" onclick="quickLogin('doctor@heartguard.com', 'doctor123', 'doctor')">Doctor Demo</button>
                <button type="button" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;" onclick="quickLogin('admin@heartguard.com', 'admin123', 'admin')">Admin Demo</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary-cyan); text-decoration: none; font-weight: 600;">Register Here</a>
        </div>
    </div>
</div>

<script>
function quickLogin(email, password, role) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = password;
    document.getElementById('loginRole').value = role;
}
</script>
{% endblock %}
